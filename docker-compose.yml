services:
  captador:
    build: .
    restart: unless-stopped
    env_file: .env

    # En el droplet de 2 GB compartido con Evolution API: el tope garantiza
    # que este proceso nunca pueda tumbar la sesion de WhatsApp.
    mem_limit: 256m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
